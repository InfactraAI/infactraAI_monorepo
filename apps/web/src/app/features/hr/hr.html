<div class="page page--wide">
  <header class="page__head">
    <div class="page__title">
      <h1>HR</h1>
      <p>Attendance and salary for the current period</p>
    </div>
    <input class="input" type="date" [(ngModel)]="selectedDate" (change)="onDateChange($event)"
           style="width: auto" />
  </header>

  <div class="stack">
    <nav class="subnav">
      <a class="subnav__tab" routerLink="attendance" routerLinkActive="is-active"
         [routerLinkActiveOptions]="{exact: true}">Attendance</a>
      <a class="subnav__tab" routerLink="salary" routerLinkActive="is-active">Salary</a>
    </nav>

    <div class="notice">
      <mat-icon>info</mat-icon>
      <div>These sheets are stored in your browser, not on the server. Imported HR
        spreadsheets aren't displayed here yet.</div>
    </div>

    <router-outlet></router-outlet>
  </div>
</div>
