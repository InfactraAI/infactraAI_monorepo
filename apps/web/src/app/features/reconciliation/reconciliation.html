<div class="page">
  <header class="page__head">
    <div class="page__title">
      <h1>Reconciliation</h1>
      <p>Net current assets · figures in ₹ crore</p>
    </div>
    <span class="tag">Sample data</span>
  </header>

  <div class="stack">
    <div class="card" style="padding: 0; overflow: hidden">
      <table class="table">
        <thead>
          <tr><th>Particulars</th><th class="num">Dec-25</th></tr>
        </thead>
        <tbody>
          @for (row of netCurrentAssetsData; track row.particulars) {
            <tr [class.is-total]="row.total">
              <td>{{ row.particulars }}</td>
              <td class="num" [class.val--loss]="row.mar25 < 0" [class.val--gain]="row.total && row.mar25 > 0">
                {{ row.mar25 | number: '1.2-2' }}
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
