services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: infactra_db
    volumes:
      - mongo_data_dev:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file: ./apps/api/.env
    environment:
      MONGO_URI: mongodb://mongodb:27017/infactra_db
      FRONTEND_URL: http://localhost
      API_BASE_URL: http://localhost
      REDIRECT_URI: http://localhost/onedrive/callback
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - /app/node_modules
      - uploads_data_dev:/app/uploads

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./apps/web:/app
      - /app/node_modules

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./apps/web/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  mongo_data_dev:
  uploads_data_dev:
